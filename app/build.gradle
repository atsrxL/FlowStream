plugins { id 'com.android.application' }

android {
    namespace 'dev.flowstream.player'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.flowstream.player'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '0.6.3'
        testInstrumentationRunner project.hasProperty('deleteChecks') ? 'dev.flowstream.player.DeletionChecks' : 'dev.flowstream.player.DeviceChecks'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        resources.pickFirsts += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
    }
    lint { abortOnError true }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.annotation:annotation-experimental:1.3.1'
    // Pinned deliberately; not a claim that these are the latest versions.
    def media3 = '1.9.3'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation "androidx.media3:media3-database:$media3"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.hierynomus:smbj:0.14.0'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
